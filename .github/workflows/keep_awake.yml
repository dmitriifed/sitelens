# .github/workflows/keep_awake.yml
# Keeps the SiteLens Streamlit Community Cloud app from sleeping.
# Light version: a scheduled HTTP ping. If the app still sleeps, switch to
# the Playwright browser version at the bottom (it loads the page like a real
# visitor, which Streamlit's sleep logic counts more reliably).

name: keep-siteLens-awake

on:
  schedule:
    # Every 10 minutes. GitHub cron is UTC and best-effort; it may run a few
    # minutes late under load, which is fine for keeping an app warm.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # lets you run it manually from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the app
        run: |
          echo "Pinging SiteLens..."
          code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 60 https://sitelens.streamlit.app/)
          echo "HTTP status: $code"
          # Do not fail the job on a non-200; a sleeping app can return 3xx
          # while it wakes. The point is to generate the request, not to gate.

