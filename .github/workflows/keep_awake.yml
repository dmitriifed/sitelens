# .github/workflows/keep_awake.yml
# Keeps the SiteLens Streamlit Community Cloud app from sleeping.
#
# The plain HTTP ping was tested and TIMED OUT against the sleeping app
# (curl exit 47). Streamlit does not serve a bare request the way it serves a
# real browser, so this version loads the page in a headless browser, clicks
# the "get this app back up" button if the app is asleep, and waits for it to
# come up. That registers as genuine activity and actually keeps it warm.

name: keep-siteLens-awake

on:
  schedule:
    # Every 10 minutes. GitHub cron is UTC and best-effort; it can run late
    # under load. That is fine for keeping an app warm.
    - cron: "*/10 * * * *"
  workflow_dispatch: {}   # run manually from the Actions tab

jobs:
  browser-wake:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + Chromium
        run: |
          npm init -y
          npm install playwright
          npx playwright install --with-deps chromium

      - name: Load the app in a real browser
        run: |
          cat > wake.js <<'EOF'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            try {
              await page.goto('https://sitelens.streamlit.app/', {
                waitUntil: 'domcontentloaded',
                timeout: 120000
              });
            } catch (e) {
              console.log('Initial load slow or errored, continuing to check for wake button:', e.message);
            }

            // If the app is asleep, Streamlit shows a button to bring it back.
            // Text has varied ("Yes, get this app back up!", "get this app back up").
            try {
              const btn = page.getByRole('button', { name: /get this app back up/i });
              if (await btn.count()) {
                console.log('App was asleep. Clicking wake button.');
                await btn.first().click();
              } else {
                console.log('No wake button found (app likely already awake).');
              }
            } catch (e) {
              console.log('Wake-button check skipped:', e.message);
            }

            // Give it time to spin up and register the session as active.
            await page.waitForTimeout(20000);
            try {
              console.log('Final page title:', await page.title());
            } catch (e) {}
            await browser.close();
          })();
          EOF
          node wake.js
        # Never let a slow wake fail the run; the request itself is the point.
        continue-on-error: true
#          EOF
#          node wake.js
